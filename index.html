<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pockemon</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Macondo&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">


</head>
<body>
    <header>
        <div class="hero-section">
        <div id="logo">
             <img src="pokemon-23-logo-png-transparent.png" alt="pockemon-logo"> 
        </div>
            <div class="hero-title">
                <h4 ><strong>POKEMON GEN I</strong></h4>
            </div>
            <div class="hero-heading">
                <h1><strong>Pikachu</strong></h1>
            </div>
            <div class="hero-paragraph">
                <p>Pikachu is an electric-type Pokemon introduced <br>
                 in Generation I. Pikachu are small, chubby, <br>
                and incredibley cute mouse-like Pokemon.<br>
                They are almost completely covered by <br>
                yellow fur.</p>
            </div>
            <div class="hero-pageholder">
                <div class="line"></div>
                <h2>01 / 08</h2>
            </div>
            <div class="pokeball-icon">  </div>
        
</div>
    <div class="character-overlay">
    <img src="pikachu-transparent-32599.png" alt="Pikachu" id="pikachu-img">
</div>



        <div class="side-hero">
            <div id="icon">
                <i class="ri-menu-line"></i>
            </div>

            <div class="slider-navigation">
                <button class="nav-dot active" aria-label="Slide 1"></button>
                <button class="nav-dot" aria-label="Slide 2"></button>
                <button class="nav-dot" aria-label="Slide 3"></button>
                <button class="nav-dot" aria-label="Slide 4"></button>
                <button class="nav-dot" aria-label="Slide 5"></button>
            </div>
        </div>
    </header>
</body>
</html>
